name: Deploy zu Hetzner

# Lädt die Seite per FTPS auf das Hetzner-Webhosting.
# Webhosting S hat kein SSH — deshalb FTPS statt rsync oder git pull.
#
# Phase 1: Testbetrieb unter http://cyvw.your-vhost.de, parallel zu GitHub Pages.
# Phase 2 (sobald schuldis.net verfügbar ist): Domain anhängen, SSL, Basis-URLs
# umstellen, PHP-Formular statt Formspree — dann wird pages.yml abgeschaltet.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # Solange die Zugangsdaten fehlen, sauber überspringen statt rot fehlzuschlagen.
      # Der Wert kommt über env herein, nicht direkt in die Befehlszeile.
      - name: Zugangsdaten hinterlegt?
        id: pruefung
        env:
          SERVER: ${{ secrets.HETZNER_FTP_SERVER }}
        run: |
          if [ -z "$SERVER" ]; then
            echo "bereit=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Übertragung übersprungen::Die Secrets HETZNER_FTP_SERVER, HETZNER_FTP_USER und HETZNER_FTP_PASSWORD sind noch nicht hinterlegt."
          else
            echo "bereit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Per FTPS hochladen
        if: steps.pruefung.outputs.bereit == 'true'
        # Auf den Commit festgenagelt statt auf den Tag v4.3.5: Ein Tag lässt sich
        # nachträglich verschieben, ein Commit nicht. Die Action bekommt hier
        # Zugangsdaten zu sehen — da ist das die sichere Variante.
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.HETZNER_FTP_SERVER }}
          username: ${{ secrets.HETZNER_FTP_USER }}
          password: ${{ secrets.HETZNER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # Die Repo-Wurzel IST der Website-Ordner — es gibt kein Unterverzeichnis
          # "website/". Der abschließende Schrägstrich lädt den INHALT hoch,
          # nicht das Verzeichnis selbst. Gilt für beide Seiten.
          local-dir: ./
          server-dir: /silviaschuldis.de/
          # Nichts pauschal löschen: Die Action gleicht per Prüfsummen ab und
          # überträgt beim zweiten Lauf nur noch Geändertes.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            **/.DS_Store
            README.md
